<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iron Man Arc Reactor Shield — AR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    overflow: hidden;
    font-family: 'Orbitron', sans-serif;
    color: #ff6a00;
  }

  #container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #webcam {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    opacity: 0.85;
  }

  #canvas {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 18px 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 10;
  }

  .hud-block {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #ff6a00;
    text-shadow: 0 0 8px #ff6a00, 0 0 20px #ff4400;
    line-height: 1.8;
    opacity: 0.85;
  }

  .hud-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ff6a00;
    text-shadow: 0 0 12px #ff6a00, 0 0 40px #ff3300, 0 0 80px #ff110044;
    text-align: center;
  }

  .hud-subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: #ff9944;
    text-align: center;
    letter-spacing: 3px;
    margin-top: 3px;
    opacity: 0.7;
  }

  #status {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: #ff6a00;
    text-shadow: 0 0 10px #ff6a00;
    letter-spacing: 2px;
    z-index: 10;
    pointer-events: none;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #scanline {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255, 106, 0, 0.03) 2px,
      rgba(255, 106, 0, 0.03) 4px
    );
    pointer-events: none;
    z-index: 5;
  }

  #vignette {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 4;
  }

  .corner {
    position: absolute;
    width: 40px; height: 40px;
    border-color: #ff6a00;
    border-style: solid;
    opacity: 0.7;
    z-index: 10;
  }
  .corner.tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }
</style>
</head>
<body>
<div id="container">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="scanline"></div>
  <div id="vignette"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div id="hud">
    <div class="hud-block">
      SYS: ONLINE<br>
      HAND TRACK: ACTIVE<br>
      SHIELD: ARMED<br>
      POWER: 100%
    </div>
    <div style="text-align:center">
      <div class="hud-title">STARK INDUSTRIES</div>
      <div class="hud-subtitle">SORCERER SHIELD — MK.VII</div>
    </div>
    <div class="hud-block" style="text-align:right">
      LAT: 40.7128°N<br>
      LON: 74.0060°W<br>
      ALT: 0843m<br>
      MODE: COMBAT
    </div>
  </div>

  <div id="status">◈ OPEN PALM TO ACTIVATE SHIELD ◈</div>
</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
const videoEl = document.getElementById('webcam');
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d');
const statusEl = document.getElementById('status');

let W, H;
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ── Shield animation state ──────────────────────────────────────────────────
const S = {
  angle: 0,
  innerAngle: 0,
  runeAngle: 0,
  glow: 0,
  glowDir: 1,
  pulse: 0,
  particles: [],
  active: false,
  opacity: 0,
  sparks: [],
};

// Palette
const C = {
  core:   '#ff6a00',
  bright: '#ffaa33',
  hot:    '#ff3300',
  gold:   '#ffd700',
  white:  '#ffffff',
  teal:   '#00eeff',
  dim:    'rgba(255,106,0,0.15)',
};

function hex2rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ── Particle system ─────────────────────────────────────────────────────────
function spawnParticle(cx, cy, r) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 0.5 + Math.random() * 2.5;
  S.particles.push({
    x: cx + Math.cos(angle) * r * 0.4,
    y: cy + Math.sin(angle) * r * 0.4,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    life: 1,
    decay: 0.015 + Math.random() * 0.025,
    size: 1 + Math.random() * 3,
  });
}

function spawnSpark(cx, cy, r) {
  const angle = Math.random() * Math.PI * 2;
  const dist  = r * (0.6 + Math.random() * 0.5);
  S.sparks.push({
    x: cx + Math.cos(angle) * dist,
    y: cy + Math.sin(angle) * dist,
    life: 1,
    decay: 0.04 + Math.random() * 0.06,
    size: 2 + Math.random() * 4,
    angle: Math.random() * Math.PI * 2,
  });
}

// ── Drawing helpers ─────────────────────────────────────────────────────────
function glow(color, blur) {
  ctx.shadowColor = color;
  ctx.shadowBlur  = blur;
}

function drawRing(cx, cy, r, lineW, color, dash=[]) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = color;
  ctx.lineWidth   = lineW;
  ctx.setLineDash(dash);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawArcSegments(cx, cy, r, n, gapFrac, lineW, color, rot=0) {
  const step = (Math.PI * 2) / n;
  const gap  = step * gapFrac;
  for (let i = 0; i < n; i++) {
    const a0 = rot + i * step + gap / 2;
    const a1 = rot + (i + 1) * step - gap / 2;
    ctx.beginPath();
    ctx.arc(cx, cy, r, a0, a1);
    ctx.strokeStyle = color;
    ctx.lineWidth   = lineW;
    ctx.stroke();
  }
}

function drawRuneText(cx, cy, r, text, angle, size, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.font = `${size}px 'Orbitron', sans-serif`;
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const chars = text.split('');
  const total = chars.length;
  chars.forEach((ch, i) => {
    const a = (i / total) * Math.PI * 2 - Math.PI / 2;
    const x = Math.cos(a) * r;
    const y = Math.sin(a) * r;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a + Math.PI / 2);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  });
  ctx.restore();
}

function drawIronManRune(cx, cy, r, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  // Triangles pattern (Iron Man-ish geometry)
  const pts = 6;
  for (let i = 0; i < pts; i++) {
    const a = (i / pts) * Math.PI * 2;
    const x1 = Math.cos(a) * r;
    const y1 = Math.sin(a) * r;
    const x2 = Math.cos(a + Math.PI / pts) * r * 0.55;
    const y2 = Math.sin(a + Math.PI / pts) * r * 0.55;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.closePath();
    ctx.strokeStyle = C.core;
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }
  ctx.restore();
}

function drawStarkSymbol(cx, cy, r) {
  // Central arc reactor / star shape
  ctx.save();
  ctx.translate(cx, cy);

  // Outer ring glow
  const grad = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
  grad.addColorStop(0,   'rgba(255,220,80,0.9)');
  grad.addColorStop(0.4, 'rgba(255,106,0,0.6)');
  grad.addColorStop(1,   'rgba(255,50,0,0)');
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Arc reactor lines (10 spokes)
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.15, Math.sin(a) * r * 0.15);
    ctx.lineTo(Math.cos(a) * r * 0.7,  Math.sin(a) * r * 0.7);
    ctx.strokeStyle = 'rgba(255,210,80,0.9)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
  }

  // Inner hexagon
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 6;
    const x = Math.cos(a) * r * 0.22;
    const y = Math.sin(a) * r * 0.22;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.strokeStyle = C.gold;
  ctx.lineWidth = 2;
  ctx.stroke();

  // Center dot
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.08, 0, Math.PI * 2);
  ctx.fillStyle = C.white;
  ctx.fill();

  ctx.restore();
}

// ── Main shield draw ────────────────────────────────────────────────────────
function drawShield(cx, cy, r, alpha) {
  if (alpha <= 0) return;

  ctx.save();
  ctx.globalAlpha = alpha;

  S.glow  += 0.04 * S.glowDir;
  if (S.glow > 1 || S.glow < 0) S.glowDir *= -1;
  const glowPulse = 0.5 + S.glow * 0.5;

  // ── Layer 1: ambient pool
  const pool = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 1.2);
  pool.addColorStop(0,   `rgba(255,106,0,${0.06 * glowPulse})`);
  pool.addColorStop(0.6, `rgba(255,50,0,${0.03 * glowPulse})`);
  pool.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, r * 1.2, 0, Math.PI * 2);
  ctx.fillStyle = pool;
  ctx.fill();

  // ── Layer 2: outermost orbit ring + rotating tick marks
  glow(C.core, 18 * glowPulse);
  drawRing(cx, cy, r * 1.08, 1.5, hex2rgba(C.core, 0.5));
  drawArcSegments(cx, cy, r * 1.08, 24, 0.4, 2, hex2rgba(C.bright, 0.8), S.angle);

  // ── Layer 3: outer data ring (segmented)
  glow(C.hot, 22);
  drawArcSegments(cx, cy, r * 0.95, 8, 0.25, 3, C.core, S.angle * 0.7);
  drawArcSegments(cx, cy, r * 0.95, 8, 0.25, 1, C.bright, S.angle * 0.7 + Math.PI / 8);

  // ── Layer 4: rune text ring
  glow(C.core, 14);
  const runeStr = 'STARKTECH◈SORCERER◈SHIELD◈MK.VII◈ARC◈REACTOR◈';
  drawRuneText(cx, cy, r * 0.82, runeStr, S.runeAngle, r * 0.045, hex2rgba(C.bright, 0.85));

  // Opposite direction runes
  const runeStr2 = '10880V◈IRONMAN◈AVENGER◈VIBRANIUM◈SHIELD◈';
  drawRuneText(cx, cy, r * 0.71, runeStr2, -S.runeAngle * 1.3, r * 0.038, hex2rgba(C.gold, 0.7));

  // ── Layer 5: iron man geometric rune (rotating)
  glow(C.hot, 20);
  drawIronManRune(cx, cy, r * 0.62, S.innerAngle);

  // ── Layer 6: mid ring + segmented arc
  glow(C.bright, 16);
  drawRing(cx, cy, r * 0.65, 2, hex2rgba(C.core, 0.7));
  drawArcSegments(cx, cy, r * 0.58, 12, 0.35, 2.5, C.bright, -S.angle * 1.1);

  // ── Layer 7: intricate cross lines
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(S.angle * 0.5);
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.12, Math.sin(a) * r * 0.12);
    ctx.lineTo(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55);
    ctx.strokeStyle = hex2rgba(C.core, 0.6);
    ctx.lineWidth = 1;
    glow(C.hot, 10);
    ctx.stroke();
  }
  ctx.restore();

  // Diagonal lines (45°)
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(S.angle * 0.5 + Math.PI / 4);
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.08, Math.sin(a) * r * 0.08);
    ctx.lineTo(Math.cos(a) * r * 0.4,  Math.sin(a) * r * 0.4);
    ctx.strokeStyle = hex2rgba(C.gold, 0.4);
    ctx.lineWidth = 0.8;
    ctx.stroke();
  }
  ctx.restore();

  // ── Layer 8: stark symbol center
  glow(C.gold, 30 * glowPulse);
  drawStarkSymbol(cx, cy, r * 0.2);

  // ── Layer 9: energy sparks around ring
  if (Math.random() < 0.3) spawnSpark(cx, cy, r);
  ctx.save();
  for (let i = S.sparks.length - 1; i >= 0; i--) {
    const sp = S.sparks[i];
    sp.life -= sp.decay;
    if (sp.life <= 0) { S.sparks.splice(i, 1); continue; }
    glow(C.bright, 12);
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.size * sp.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,${150 + Math.floor(sp.life * 100)},0,${sp.life})`;
    ctx.fill();
  }
  ctx.restore();

  // ── Layer 10: particles floating outward
  if (Math.random() < 0.5) spawnParticle(cx, cy, r);
  ctx.save();
  for (let i = S.particles.length - 1; i >= 0; i--) {
    const p = S.particles[i];
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if (p.life <= 0) { S.particles.splice(i, 1); continue; }
    glow(C.core, 6);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,${80 + Math.floor(p.life * 120)},0,${p.life * 0.8})`;
    ctx.fill();
  }
  ctx.restore();

  // ── Outer ring solid
  glow(C.bright, 25 * glowPulse);
  drawRing(cx, cy, r, 2.5, C.bright);
  glow(C.core, 8);
  drawRing(cx, cy, r, 1,   C.core);

  ctx.restore();

  // Advance time
  S.angle      += 0.012;
  S.innerAngle -= 0.018;
  S.runeAngle  += 0.006;
  S.pulse      += 0.05;
}

// ── Palm center from landmarks ──────────────────────────────────────────────
function getPalmCenter(lm) {
  // Average of wrist (0) and knuckles (5,9,13,17)
  const indices = [0, 5, 9, 13, 17];
  let x = 0, y = 0;
  indices.forEach(i => { x += lm[i].x; y += lm[i].y; });
  x /= indices.length;
  y /= indices.length;
  // Mirror x because video is flipped
  return { x: (1 - x) * W, y: y * H };
}

function getPalmRadius(lm) {
  // Distance from wrist to middle-finger MCP (9)
  const dx = (lm[0].x - lm[9].x) * W;
  const dy = (lm[0].y - lm[9].y) * H;
  return Math.sqrt(dx * dx + dy * dy) * 1.15;
}

// ── MediaPipe Hands ─────────────────────────────────────────────────────────
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7,
  minTrackingConfidence: 0.6,
});

let palmCX = 0, palmCY = 0, palmR = 100;
let handDetected = false;

hands.onResults(results => {
  ctx.clearRect(0, 0, W, H);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const lm = results.multiHandLandmarks[0];
    handDetected = true;

    const pc = getPalmCenter(lm);
    const pr = getPalmRadius(lm);

    // Smooth
    palmCX += (pc.x - palmCX) * 0.25;
    palmCY += (pc.y - palmCY) * 0.25;
    palmR  += (pr   - palmR)  * 0.25;

    S.active  = true;
    S.opacity = Math.min(1, S.opacity + 0.06);
    statusEl.textContent = '⚡ SHIELD ACTIVE — STARK TECH ENGAGED ⚡';
  } else {
    handDetected = false;
    S.active  = false;
    S.opacity = Math.max(0, S.opacity - 0.04);
    if (S.opacity === 0) {
      S.particles = [];
      S.sparks    = [];
    }
    statusEl.textContent = '◈ OPEN PALM TO ACTIVATE SHIELD ◈';
  }

  drawShield(palmCX, palmCY, palmR * 1.6, S.opacity);
});

// ── Camera ──────────────────────────────────────────────────────────────────
const camera = new Camera(videoEl, {
  onFrame: async () => { await hands.send({ image: videoEl }); },
  width: 1280,
  height: 720,
});
camera.start();

// Fallback idle pulse when no hand present
function idleLoop() {
  if (!handDetected && S.opacity === 0) {
    ctx.clearRect(0, 0, W, H);
  }
  requestAnimationFrame(idleLoop);
}
idleLoop();
</script>
</body>
</html>
